{# One icon per application status / email type. Used on the dashboard, the Emails page and the job page. #}
{% macro status_icon(s) -%}
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
{%- if s == 'ready' -%}<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>
{%- elif s == 'applied' -%}<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>
{%- elif s == 'acknowledged' -%}<path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/><path d="M15 17l2 2 4-4" class="tick"/>
{%- elif s == 'pre_screen' -%}<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{%- elif s == 'assessment' -%}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 11l1.5 1.5L13 9.5M8.5 16.5l1.5 1.5 3-3"/>
{%- elif s == 'interview' -%}<circle cx="9" cy="8" r="3"/><path d="M3 20c.8-3.5 3.2-5.5 6-5.5s5.2 2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.5c2.4.2 4 1.8 4.5 4.5"/>
{%- elif s == 'second_stage' -%}<path d="M3 20h5v-5h5v-5h5V5h3"/><path d="M15 3h6v6" class="tick"/>
{%- elif s == 'offer' -%}<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>
{%- elif s == 'rejected' -%}<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
{%- elif s == 'withdrawn' -%}<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>
{%- elif s == 'sent' -%}<path d="M10 8L5 12l5 4"/><path d="M5 12h9a5 5 0 0 1 5 5v1"/>
{%- elif s == 'job_alert' -%}<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>
{%- else -%}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro status_badge(s, label) -%}
<span class="st st-{{ s }}">{{ status_icon(s) }}<span>{{ label }}</span></span>
{%- endmacro %}
