<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Job Hunt HQ</title>
  <style>
    body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: #1f3a5f; color: #fff;
           display: grid; place-items: center; height: 100vh; text-align: center; padding: 0 16px; }
    b { color: #e0a526; }
  </style>
</head>
<body>
  <div><b>Job Hunt HQ</b><p id="m">Sending your details to the form…</p></div>
  <script>
  (async () => {
    const m = document.getElementById('m');
    let req;
    try { req = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch { m.textContent = 'Nothing to do.'; return; }
    history.replaceState(null, '', location.pathname);
    const send = (data) => { if (window.opener) window.opener.postMessage(Object.assign({jhq: true}, data), '*'); };
    try {
      const r = await fetch('{{ url_for("api_bridge") }}', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                          body: JSON.stringify(req)});
      if (r.status === 403) throw new Error('This button is out of date. Drag it from the Setup page again.');
      if (!r.ok) throw new Error('Job Hunt HQ had a problem (' + r.status + ').');
      const pack = await r.json();
      if (req.action === 'fill') {
        pack.blobs = {};
        for (const [which, url] of Object.entries(pack.files || {})) {
          if (!url) continue;
          const f = await fetch(url + '?token=' + encodeURIComponent(req.token));
          if (f.ok) pack.blobs[which] = {name: decodeURIComponent(f.headers.get('X-Filename') || which + '.pdf'), blob: await f.blob()};
        }
      }
      send(pack);
      m.textContent = 'Done.';
    } catch (e) {
      send({error: e.message});
      m.textContent = e.message;
      return;
    }
    setTimeout(() => window.close(), 150);
  })();
  </script>
</body>
</html>
